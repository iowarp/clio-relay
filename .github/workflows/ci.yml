name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  lint:
    name: ruff and pyright
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.28"
      - name: install dependencies
        run: uv sync --python "3.12" --locked --all-groups
      - name: ruff check
        run: uv run --no-sync ruff check
      - name: ruff format
        run: uv run --no-sync ruff format --check
      - name: pyright, held to the error ratchet
        run: uv run --no-sync python scripts/check_pyright_ratchet.py
      - name: file size ratchet
        run: uv run --no-sync python scripts/check_file_size.py
      - name: no classes inside functions
        run: uv run --no-sync python scripts/check_no_class_in_function.py

  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.28"
      - name: install dependencies
        run: uv sync --python "${{ matrix.python-version }}" --locked --all-groups
      - name: pytest
        run: uv run --no-sync pytest

  adapter-template:
    name: adapter template conformance / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: examples/adapter-template
    steps:
      - name: check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.28"
      # What the template's README tells a newcomer to run: the conformance kit
      # against the fake facility, with clio-relay from this checkout.
      - name: pytest
        run: uv run --python "3.12" pytest

  # A regression check that does not gate merges: the conformance kit for the
  # ssh adapter (W2's fx-ssh, fx-slurm and fx-pbs) and the worker adapter
  # (placed on fx-slurm, linked through fx-frps), on Docker fixtures.
  adapter-conformance:
    name: ssh and worker conformance on the fixture sites
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      FX_SITES: ssh slurm pbs frps
    steps:
      - name: name the fixture and worker paths
        run: |
          {
            echo "FX_STATE_DIR=$RUNNER_TEMP/fx"
            echo "CLIO_RELAY_FIXTURES_ENV=$RUNNER_TEMP/fx/fixtures.env"
            echo "RELAY_TEST_WORKER_CONFIG=$RUNNER_TEMP/worker-config.json"
            echo "RELAY_TEST_WORKER_DIR=$RUNNER_TEMP/worker-state"
          } >>"$GITHUB_ENV"
      - name: check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.28"
      - name: install dependencies
        run: uv sync --python "3.12" --locked --all-groups
      - name: build the wheel the worker site installs
        run: uv build --wheel -o "$RUNNER_TEMP/dist"
      - name: start the fixture sites
        run: scripts/ares/fixtures.sh up
      - name: write the worker config
        run: |
          mkdir -p "$RELAY_TEST_WORKER_DIR"
          uv run --no-sync python scripts/ares/fixtures_worker_config.py \
            "$CLIO_RELAY_FIXTURES_ENV" "$(ls "$RUNNER_TEMP"/dist/clio_relay-*.whl)" \
            "$RELAY_TEST_WORKER_CONFIG"
      - name: pytest
        run: >
          uv run --no-sync pytest
          tests/relay_ssh/test_ssh_conformance.py
          tests/worker/test_conformance_worker.py
      - name: remove the fixture sites
        if: always()
        run: scripts/ares/fixtures.sh down --images

  build:
    name: build the wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.28"
      - name: build
        run: uv build
      - name: install the wheel and run its entry point
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/clio_relay-*.whl)"
          uv run --python 3.12 --no-project --with "$wheel" clio-relay --help
