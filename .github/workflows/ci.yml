name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  lint:
    name: ruff and pyright
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.28"
      - name: install dependencies
        run: uv sync --python "3.12" --locked --all-groups
      - name: ruff check
        run: uv run --no-sync ruff check
      - name: ruff format
        run: uv run --no-sync ruff format --check
      - name: pyright
        run: uv run --no-sync pyright

  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "0.11.28"
      - name: install dependencies
        run: uv sync --python "${{ matrix.python-version }}" --locked --all-groups
      - name: pytest
        run: uv run --no-sync pytest

  build:
    name: build the wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.28"
      - name: build
        run: uv build
      - name: install the wheel and run its entry point
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/clio_relay-*.whl)"
          uv run --python 3.12 --no-project --with "$wheel" clio-relay --help
