name: release

on:
  push:
    tags: ["v*"]
  # Publishes an earlier tag's GitHub Release assets to PyPI, byte for byte.
  # Run it from a v* tag ref, the only refs the pypi environment admits.
  workflow_dispatch:
    inputs:
      tag:
        description: an existing release tag, such as v2.0.0a36
        required: true
        type: string

concurrency:
  group: clio-relay-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build the tagged distributions
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: check out the tagged commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.28"
      - name: check the tag matches the package version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          test "$TAG_NAME" = "v$version"
          prerelease="$(uv run --no-project --with packaging==24.2 python -c \
            'import sys; from packaging.version import Version; print(str(Version(sys.argv[1]).is_prerelease).lower())' \
            "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: build
        env:
          CLIO_RELAY_RELEASE_BUILD: "1"
        run: uv build
      - name: record the checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: upload the distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: attach the distributions to a GitHub Release
    needs: build
    if: github.repository == 'iowarp/clio-relay'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict SHA256SUMS)
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$TAG_NAME" dist/* --verify-tag \
            --title "clio-relay $VERSION" --notes-file - "${flags[@]}" <<EOF
          clio-relay $VERSION, built from $TAG_NAME ($GITHUB_SHA).
          Check a download against SHA256SUMS: \`sha256sum --check SHA256SUMS\`.
          EOF

  publish:
    name: publish to PyPI
    needs: build
    if: github.repository == 'iowarp/clio-relay'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/clio-relay/
    permissions:
      id-token: write
    steps:
      - name: download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: keep only the distributions
        run: rm dist/SHA256SUMS
      - name: publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/

  publish-existing:
    name: publish an existing release to PyPI
    if: github.event_name == 'workflow_dispatch' && github.repository == 'iowarp/clio-relay'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/clio-relay/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: download and check the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TAG_NAME" in v[0-9]*) ;; *) echo "not a release tag: $TAG_NAME" >&2; exit 1 ;; esac
          version="${TAG_NAME#v}"
          gh release download "$TAG_NAME" --dir dist
          cd dist
          sha256sum --check --strict SHA256SUMS
          test -f "clio_relay-$version-py3-none-any.whl"
          test -f "clio_relay-$version.tar.gz"
          rm SHA256SUMS
          ls -l
      - name: publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/