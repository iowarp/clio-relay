name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: clio-relay-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build the tagged distributions
    runs-on: ubuntu-latest
    steps:
      - name: check out the tagged commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.28"
      - name: check the tag matches the package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          test "$TAG_NAME" = "v$version"
      - name: build
        env:
          CLIO_RELAY_RELEASE_BUILD: "1"
        run: uv build
      - name: upload the distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: github.repository == 'iowarp/clio-relay'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/clio-relay/
    permissions:
      id-token: write
    steps:
      - name: download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
