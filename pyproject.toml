[project]
name = "clio-relay"
version = "2.0.0a66"
description = "An MCP server and command line that runs jobs, commands, files and services on your compute sites."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "aioquic>=1.9.1,<1.10",
    "asyncssh>=2.24,<3",
    "clio-schemas==0.2.1",
    "cryptography>=50.0.0",
    "fastapi>=0.115",
    "fastmcp==4.2.1",
    "fastmcp-slim[client,server]==4.2.1",
    "fastmcp-tasks==4.2.1",
    "filelock>=3.15",
    "httpx[socks]>=0.27,<1",
    "jsonschema>=4.23",
    "keyring>=25",
    "mcp==2.3.0",
    "packaging>=24.2",
    "psij-python==0.9.11",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
    "websockets>=16.0",
]

[project.urls]
Homepage = "https://github.com/iowarp/clio-relay"
Repository = "https://github.com/iowarp/clio-relay"
Issues = "https://github.com/iowarp/clio-relay/issues"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clio_relay"]

[tool.hatch.build.targets.sdist]
include = [
    "hatch_build.py",
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
    "uv.lock",
]

[project.scripts]
clio-relay = "clio_relay.cli:main"
clio-relay-askpass = "clio_relay.asks.askpass:main"

[project.entry-points."clio_relay.adapters"]
local = "clio_relay.adapters.local:LocalAdapter"
ssh = "clio_relay.adapters.ssh:SshAdapter"
tapis = "clio_relay.adapters.tapis:TapisAdapter"
globus = "clio_relay.adapters.globus:GlobusAdapter"
iri = "clio_relay.adapters.iri:IriAdapter"
sky = "clio_relay.adapters.sky:SkyAdapter"
worker = "clio_relay.adapters.worker:WorkerAdapter"

[project.entry-points."clio_relay.hooks"]
asks = "clio_relay.asks:create_provider"
guard = "clio_relay.guard:create_guard"
serve = "clio_relay.serve:factory"

[project.optional-dependencies]
tapis = ["tapipy==25.4.0", "requests[socks]"]
globus = ["globus-sdk>=4.10,<5", "globus-compute-sdk>=4.21,<4.22", "requests[socks]"]
iri = []
testing = [
    "keyrings.alt>=5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    "hatchling==1.31.0",
    "jarvis-cd @ https://github.com/grc-iit/jarvis-cd/releases/download/v1.9.25/jarvis_cd-1.9.25-py3-none-any.whl",
    "pip-audit>=2.10.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "twine>=6.2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "release_platform(platform): test is executed only on its named native platform and is covered by the release matrix",
]
