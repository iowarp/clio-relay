[project]
name = "relay-acme"
version = "0.1.0"
description = "A clio-relay adapter for the Acme facility (a template to copy)"
requires-python = ">=3.12"
dependencies = [
    "clio-relay[testing]",
    "httpx>=0.27,<1",
]

# This line is the whole registration: relay finds the adapter by this entry point.
[project.entry-points."clio_relay.adapters"]
acme = "relay_acme:AcmeAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_acme"]

# Inside the clio-relay repository the template uses the checkout. In a copy of
# your own, point this at a released clio-relay or a git URL instead.
[tool.uv.sources]
clio-relay = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.pyright]
extraPaths = ["src", "tests"]
typeCheckingMode = "strict"
