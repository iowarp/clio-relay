# One-node Slurm cluster for the clio-relay fixtures. Partitions match Ares:
# compute (default) and debug.
ClusterName=fixture
SlurmctldHost=fx-slurm
SlurmUser=slurm
SlurmdUser=root
AuthType=auth/munge
CryptoType=crypto/munge
MpiDefault=none

SlurmctldPort=6817
SlurmdPort=6818
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# Containers have no delegated cgroup tree, so track processes through /proc.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStoragePort=6819
JobCompType=jobcomp/none

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
ReturnToService=2
SlurmctldTimeout=60
SlurmdTimeout=60
InactiveLimit=0
KillWait=10
MinJobAge=300
Waittime=0

NodeName=fx-slurm CPUs=4 RealMemory=2048 State=UNKNOWN
PartitionName=compute Nodes=fx-slurm Default=YES MaxTime=INFINITE State=UP
PartitionName=debug Nodes=fx-slurm Default=NO MaxTime=30:00 State=UP
